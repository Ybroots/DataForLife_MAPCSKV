# Re-include in every location that sets its own add_header (nginx does not inherit add_header then).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# HSTS: start short, raise to 31536000 after a week of clean HTTPS. Browsers ignore HSTS on the bare-IP host.
# Do NOT add includeSubDomains/preload until the certificate renewal timer is proven.
add_header Strict-Transport-Security "max-age=300" always;
