# Existing VPS, trusted short-lived IP certificate managed by a dedicated timer.
# Rate-limit zones (http context; this file is included inside http{}). Keys are per client IP.
# CGNAT mobile carriers share IPs, so SOS limits are generous: the strict per-account limit belongs in the API.
map $request_method $dfl_post_key { POST $binary_remote_addr; default ""; }
limit_req_zone $binary_remote_addr zone=dfl_auth:10m rate=10r/m;
limit_req_zone $dfl_post_key zone=dfl_sos:10m rate=30r/m;
limit_req_zone $dfl_post_key zone=dfl_report:10m rate=10r/m;
# Mọi lệnh gọi API còn lại (tra cứu, danh bạ, tải ảnh...): 10 yêu cầu/giây/IP, đủ rộng cho nhiều máy dùng chung IP mạng di động.
limit_req_zone $binary_remote_addr zone=dfl_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=dfl_conn:10m;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 42.96.15.215;
    root /var/www/dataforlife;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 308 https://42.96.15.215$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name bandosocskv.com www.bandosocskv.com;
    root /var/www/dataforlife;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 308 https://bandosocskv.com$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 42.96.15.215;
    ssl_certificate /etc/dataforlife/acme/live/dataforlife-ip/fullchain.pem;
    ssl_certificate_key /etc/dataforlife/acme/live/dataforlife-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DataForLifeSSL:10m;
    ssl_session_timeout 1d;

    # The all-province GeoJSON is ~1 MiB before compression; mobile clients
    # should not have to transfer the uncompressed boundaries or JS bundles.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;

    root /var/www/dataforlife;
    index index.html;
    # A valid 20 MiB video becomes ~27 MiB of JSON after base64 encoding.
    client_max_body_size 32m;
    include /etc/nginx/snippets/dataforlife-security-headers.conf;
    include /etc/nginx/snippets/mobirace-api.conf;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    # Same JSON shape as the API's errors so the web client shows a clear message instead of "cannot connect".
    error_page 429 = @rate_limited;
    location @rate_limited {
        include /etc/nginx/snippets/dataforlife-security-headers.conf;
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":"RATE_LIMITED","message":"Bạn thao tác quá nhanh. Vui lòng đợi khoảng 1 phút rồi thử lại. Nếu đang nguy hiểm, hãy gọi 112 hoặc 113."}';
    }
    location = /index.html { include /etc/nginx/snippets/dataforlife-security-headers.conf; add_header Cache-Control "no-cache"; }
    # Credential endpoints: brute-force / registration flood protection.
    location ~ ^/api/v1/auth/(officer|citizen)/(login|register)$ {
        limit_req zone=dfl_auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/dataforlife-security-headers.conf;
        include /etc/nginx/snippets/dataforlife-api-proxy.conf;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "no-store" always;
    }
    # POST-only limits (GET polling is not limited because $dfl_post_key is empty for GET).
    location = /api/v1/citizen/sos {
        limit_req zone=dfl_sos burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/dataforlife-security-headers.conf;
        include /etc/nginx/snippets/dataforlife-api-proxy.conf;
        proxy_pass http://127.0.0.1:3001/v1/citizen/sos;
        add_header Cache-Control "no-store" always;
    }
    location = /api/v1/citizen/incidents {
        limit_req zone=dfl_report burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/dataforlife-security-headers.conf;
        include /etc/nginx/snippets/dataforlife-api-proxy.conf;
        proxy_pass http://127.0.0.1:3001/v1/citizen/incidents;
        add_header Cache-Control "no-store" always;
    }
    # Public province boundaries (~1 MiB): let the API's own "public, max-age=300" win.
    # The generic /api/ block below appends "no-store", which defeats caching.
    location = /api/v1/areas/overview {
        limit_req zone=dfl_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/dataforlife-security-headers.conf;
        include /etc/nginx/snippets/dataforlife-api-proxy.conf;
        proxy_pass http://127.0.0.1:3001/v1/areas/overview;
    }
    location /api/ {
        limit_req zone=dfl_api burst=120 nodelay;
        limit_req_status 429;
        limit_conn dfl_conn 80;
        limit_conn_status 429;
        include /etc/nginx/snippets/dataforlife-security-headers.conf;
        include /etc/nginx/snippets/dataforlife-api-proxy.conf;
        proxy_pass http://127.0.0.1:3001/;
        add_header Cache-Control "no-store";
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        include /etc/nginx/snippets/dataforlife-security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}

