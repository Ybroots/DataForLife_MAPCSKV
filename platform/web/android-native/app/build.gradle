apply plugin: 'com.android.application'

// Release signing material lives only in android-native/keystore.properties (git-ignored).
// Never commit the keystore or its passwords; never sign a release with the debug key.
def keystoreFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
// Override with -PcskvVersionCode=2 -PcskvVersionName=1.0.1 ; versionCode must increase for every shipped build.
def cskvVersionCode = (project.findProperty('cskvVersionCode') ?: '1').toString().toInteger()
def cskvVersionName = (project.findProperty('cskvVersionName') ?: '1.0.0-preview').toString()
// -PcskvOfficer=true: app dành cho cán bộ CSKV (cài song song với app người dân, mã ứng dụng riêng).
def cskvOfficer = (project.findProperty('cskvOfficer') ?: 'false').toString() == 'true'

android {
    namespace = "com.bandosocskv.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId cskvOfficer ? "com.bandosocskv.officer" : "com.bandosocskv.mobile"
        // Tên và biểu tượng riêng để hai app (người dân / cán bộ) không lẫn nhau trên màn hình điện thoại.
        resValue "string", "app_name", cskvOfficer ? "CSKV Cán bộ" : "CSKV Người dân"
        resValue "string", "title_activity_main", cskvOfficer ? "CSKV Cán bộ" : "CSKV Người dân"
        manifestPlaceholders = [
            appIcon     : cskvOfficer ? "@mipmap/ic_launcher_officer" : "@mipmap/ic_launcher",
            appIconRound: cskvOfficer ? "@mipmap/ic_launcher_officer_round" : "@mipmap/ic_launcher_round"
        ]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode cskvVersionCode
        versionName cskvVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    // Một tệp google-services.json có thể chứa cả hai ứng dụng; chỉ bật Firebase khi có đúng mã ứng dụng của bản đang build.
    def servicesJSON = file('google-services.json')
    def appPackage = cskvOfficer ? 'com.bandosocskv.officer' : 'com.bandosocskv.mobile'
    def packagePattern = java.util.regex.Pattern.compile('"package_name"\\s*:\\s*"' + java.util.regex.Pattern.quote(appPackage) + '"')
    if (servicesJSON.exists() && packagePattern.matcher(servicesJSON.text).find()) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Fail fast: a release artifact without the owner's signing key must never be produced.
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find { it.project == project && (it.name == 'assembleRelease' || it.name == 'bundleRelease') }
    if (releaseTask && !keystoreFile.exists()) {
        throw new GradleException('android-native/keystore.properties is required for release builds (see platform/docs/android-release.md).')
    }
}
